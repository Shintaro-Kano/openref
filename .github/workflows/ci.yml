name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Validate (macOS arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Frontend build
        working-directory: app
        run: npm run build

      # cargo test, svelte-check, node / python tests, shell syntax, license audit (the list lives in scripts/test-all.sh)
      - name: Test suite
        run: bash scripts/test-all.sh
