name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS arm64 Release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency across manifests and git tag
        # Cargo.toml [workspace.package] version is the single source (Tauri uses it for Info.plist); app/package.json must match; X.Y.Z only
        run: scripts/bundle-dist.sh --check-only target/release-dist "${GITHUB_REF_NAME#v}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run test suite before packaging
        run: bash scripts/test-all.sh

      - name: Build and assemble signed release tarball
        # builds the release tarball: version check, cargo build --release --locked + tauri build, assembly, sha256
        run: scripts/bundle-dist.sh target/release-dist "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/release-dist/dl/openref-macos-arm64.tar.gz \
            target/release-dist/dl/openref-macos-arm64.tar.gz.sha256 \
            site/install.sh \
            site/uninstall.sh \
            --title "OpenRef $GITHUB_REF_NAME" \
            --generate-notes
