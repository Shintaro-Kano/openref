[package]
name = "openref-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
serde.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
ureq.workspace = true
url.workspace = true
roxmltree.workspace = true
fastrand.workspace = true
walkdir.workspace = true
unicode-normalization.workspace = true
time.workspace = true
regex.workspace = true
pdf-extract = "0.12"
md5 = "0.7"
sha2 = "0.10"
percent-encoding = "2"
html5ever = "0.38"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 本棚の表紙をプロセス内の QuickLook（QLThumbnailGenerator）で作る（shelf/thumbs.rs）。版は Tauri 経由で Cargo.lock にある物
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }

[dev-dependencies]
# 登録表の応答のクエリ数を数えるテスト用（rusqlite の profile）
rusqlite = { workspace = true, features = ["trace"] }
