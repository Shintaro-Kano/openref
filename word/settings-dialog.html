<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenRef — 文書の設定</title>
  <script>
    // Startup テンプレート版（?host=dotm = OpenRef Dialog.app の WKWebView）は office.js を読まない。Office では従来どおり同期読込
    if (!/[?&]host=dotm(&|$)/.test(location.search)) document.write('<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"><\/script>');
  </script>
  <link rel="stylesheet" href="/word/dialog.css" />
</head>
<body class="rd-body">
  <div class="rd-page">
    <div class="rd-tabs" role="tablist">
      <button id="rd-tab-style" class="rd-tab" type="button" role="tab" aria-selected="true">引用スタイル</button>
      <button id="rd-tab-doc" class="rd-tab" type="button" role="tab" aria-selected="false">文書の設定</button>
    </div>

    <section id="rd-pane-style" class="rd-pane" role="tabpanel">
      <input id="rd-filter" class="rd-input" type="text" autocomplete="off" spellcheck="false" placeholder="スタイルを絞り込み（誌名・id）" aria-label="スタイルを絞り込み" />
      <div id="rd-styles" class="rd-list" role="listbox" aria-label="導入済みのスタイル"></div>
      <p class="rd-hint">約 1 万誌のスタイルから追加するには OpenRef app の『引用スタイルを変更…』を使います（追加したスタイルはここに並びます）。</p>
    </section>

    <section id="rd-pane-doc" class="rd-pane" role="tabpanel" hidden>
      <label class="rd-check"><input id="rd-doi" type="checkbox" /> DOI / URL を常に含める</label>
      <p class="rd-hint">スタイルが DOI を省く場合も文献リストの末尾に付けます（DOI が無ければ URL）。</p>
      <div class="rd-fields">
        <label class="rd-field">フォント<input id="rd-font" class="rd-input" type="text" autocomplete="off" spellcheck="false" /></label>
        <label class="rd-field rd-narrow">サイズ（pt）<input id="rd-size" class="rd-input" type="number" step="0.5" min="4" max="72" /></label>
      </div>
      <div id="rd-err" class="rd-field-err" hidden></div>
      <p class="rd-hint">引用番号・文献リスト・References 見出しに毎回適用します（既定 Century 10.5pt）。</p>
    </section>

    <div class="rd-actions">
      <button id="rd-cancel" class="rd-btn" type="button">キャンセル</button>
      <button id="rd-ok" class="rd-btn rd-primary" type="button">適用</button>
    </div>
    <div class="rd-footer"><span id="rd-foot"></span></div>
  </div>
  <script src="/word/dialog-common.js"></script>
  <script src="/word/settings-dialog.js"></script>
</body>
</html>
